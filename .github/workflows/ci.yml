name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked            
        
      - name: Lint with Ruff
        run: uvx ruff@0.16.10 check .

      - name: Check app imports
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci
          SECRET_KEY: "ci-not-a-real-secret"
        run: uv run python -c "import main"

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build image 
        run: docker build -t fastapiblog .
